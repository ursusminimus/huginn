<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huginn Tasks (Online)</title>
    <style>
        /* === Base === */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Georgia", serif;
            padding: 15px;
            font-size: 0.9em;
            background-color: #2A3439;
            color: #1f1f1f;
        }

        /* === Table === */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #5a5a5a;
            padding: 8px;
            text-align: left;
            vertical-align: middle;
            word-wrap: break-word;
        }
        th {
            background-color: #2f4f4f;
            color: #DBD7D2;
            cursor: pointer;
            position: relative;
            white-space: nowrap;
        }
        th.sort-asc::after, th.sort-desc::after {
            position: absolute; right: 8px; top: 50%;
            transform: translateY(-50%); font-size: 0.8em; color: #a0d0d0;
        }
        th.sort-asc::after { content: ' ▲'; }
        th.sort-desc::after { content: ' ▼'; }

        /* Column widths — full mode */
        .col-actions { width: 8%; }
        .col-order   { width: 5%; }
        .col-text    { width: 22%; }
        .col-project { width: 10%; }
        .col-effort  { width: 4%; }
        .col-created { width: 8%; }
        .col-next    { width: 8%; }
        .col-deadline{ width: 8%; }
        .col-desc    { width: 27%; }

        /* Reduced view — drop effort + created */
        table.view-reduced .col-effort,
        table.view-reduced .col-created { display: none; }
        table.view-reduced .col-text    { width: 22%; }
        table.view-reduced .col-project { width: 12%; }
        table.view-reduced .col-order   { width: 5%; }
        table.view-reduced .col-next    { width: 10%; }
        table.view-reduced .col-deadline{ width: 10%; }
        table.view-reduced .col-desc    { width: 28%; }
        table.view-reduced .col-actions { width: 10%; }

        /* Mobile view — actions, task, next action only */
        table.view-mobile .col-order,
        table.view-mobile .col-project,
        table.view-mobile .col-effort,
        table.view-mobile .col-created,
        table.view-mobile .col-deadline,
        table.view-mobile .col-desc { display: none; }
        table.view-mobile .col-actions { width: 30%; }
        table.view-mobile .col-text    { width: 40%; }
        table.view-mobile .col-next    { width: 30%; }

        tr:nth-child(even) { background-color: #E5E9EB; }
        tr:nth-child(odd) { background-color: #DBD7D2; }
        tr:hover { background-color: #008C82; color: #fff; }
        tr:hover td { border-color: #005f5f; }

        tr.status-done td { text-decoration: line-through; color: #555 !important; background-color: #d0d0d0 !important; }
        tr.status-done:hover td { background-color: #b0b0b0 !important; color: #333 !important; }
        tr.status-stopped td { text-decoration: line-through; color: #776666 !important; background-color: #f0e0e0 !important; }
        tr.status-stopped:hover td { background-color: #e0d0d0 !important; color: #333 !important; }
        tr.status-done td:first-child button, tr.status-stopped td:first-child button { color: #444; text-decoration: none; }
        tr.status-done td:first-child button:hover, tr.status-stopped td:first-child button:hover { color: #005f5f; }

        tr.running-late { border-left: 3px solid #a00; }

        tr.selected-row td { background-color: #a8d8d4 !important; color: #1f1f1f !important; }
        tr.selected-row:hover td { background-color: #88c8c4 !important; }

        td.date-past { background-color: #ffdddd !important; color: #a00 !important; font-weight: bold; }
        td.date-today { background-color: #fff0dd !important; color: #a60 !important; font-weight: bold; }
        tr.status-done td.date-past, tr.status-done td.date-today,
        tr.status-stopped td.date-past, tr.status-stopped td.date-today {
            background-color: inherit; color: inherit; text-decoration: line-through;
        }

        /* === Controls === */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            background-color: #DBD7D2; border: 1px solid #5a5a5a;
            padding: 10px; border-radius: 5px;
        }
        .toolbar + .toolbar { margin-top: 8px; }
        /* .toolbar sets display:flex, which would beat the UA [hidden] rule */
        .toolbar[hidden] { display: none; }
        .toolbar input[type="text"] {
            flex-grow: 1; min-width: 150px; padding: 6px;
            border: 1px solid #888; border-radius: 3px; font-family: inherit;
        }
        .toolbar-spacer { flex-grow: 1; }

        button {
            padding: 8px 12px; background-color: #008C82; color: white;
            border: none; border-radius: 4px; cursor: pointer;
            transition: background-color 0.2s ease; font-family: inherit; font-size: 0.85em;
        }
        button:hover { background-color: #005f5f; }
        button.active-mode { background-color: #d66; border: 1px solid #a44; }
        button.active-mode:hover { background-color: #b44; }
        button.secondary { background-color: #888; }
        button.secondary:hover { background-color: #666; }

        td.cell-actions { text-align: center; }
        td.cell-actions button {
            background: none; border: none; font-size: 1.3em; cursor: pointer;
            padding: 2px; margin: 0 2px; color: #2f4f4f;
            vertical-align: middle; line-height: 1;
        }
        td.cell-actions button:hover { color: #008C82; }

        td.cell-desc { font-size: 0.85em; color: #333; }

        #summaryStats {
            margin-top: 20px; padding: 10px;
            background-color: #DBD7D2; border: 1px solid #5a5a5a;
            border-radius: 5px; text-align: center; font-weight: bold;
        }

        /* === Modal Overlay === */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #DBD7D2; border: 2px solid #2f4f4f;
            border-radius: 8px; padding: 24px; min-width: 480px; max-width: 600px;
            width: 90%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .modal h2 {
            margin-bottom: 16px; color: #2f4f4f; font-size: 1.2em;
            border-bottom: 2px solid #2f4f4f; padding-bottom: 8px;
        }
        .modal-grid {
            display: grid; grid-template-columns: auto 1fr;
            gap: 10px 15px; align-items: center;
        }
        .modal-grid.wide { grid-template-columns: auto 1fr auto 1fr; }
        .modal-grid label { font-weight: bold; text-align: right; font-size: 0.9em; }
        .modal-grid input, .modal-grid select, .modal-grid textarea {
            width: 100%; padding: 6px; border: 1px solid #888;
            border-radius: 3px; font-family: inherit; font-size: 0.9em;
        }
        .modal-grid textarea { resize: vertical; min-height: 60px; }
        .modal-grid .span-full { grid-column: 1 / -1; }
        .modal-grid.wide .span-wide { grid-column: 2 / 5; }

        /* Read-only view modal */
        .view-grid {
            display: grid; grid-template-columns: auto 1fr;
            gap: 8px 15px; align-items: start;
        }
        .view-grid .k {
            font-weight: bold; text-align: right;
            font-size: 0.9em; color: #2f4f4f;
        }
        .view-grid .v {
            font-size: 0.9em; white-space: pre-wrap;
            word-break: break-word; color: #1f1f1f;
        }
        .modal-actions {
            margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;
        }
        #editMultiHint {
            margin-bottom: 12px; font-size: 0.85em; color: #555; line-height: 1.4;
        }
        /* Fields not editable across a multi-selection (task text + description) */
        .modal-grid input:disabled, .modal-grid textarea:disabled, .modal-grid select:disabled {
            background-color: #c8c4bf; color: #777; cursor: not-allowed;
        }
        .modal-grid label.disabled { color: #888; }

        #fileInput { display: none; }

        /* === Auth gate === */
        #authOverlay {
            position: fixed; inset: 0; background: #2A3439;
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        #authBox {
            background: #DBD7D2; border: 2px solid #2f4f4f; border-radius: 8px;
            padding: 28px; width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #authBox h1 { color: #2f4f4f; font-size: 1.3em; margin-bottom: 4px; }
        #authBox p.sub { color: #555; font-size: 0.85em; margin-bottom: 16px; }
        #authBox input {
            width: 100%; padding: 8px; margin-bottom: 10px;
            border: 1px solid #888; border-radius: 3px; font-family: inherit; font-size: 0.95em;
        }
        #authBtns { display: flex; gap: 10px; margin-top: 4px; }
        #authBtns button { flex: 1; }
        #authMsg { margin-top: 12px; font-size: 0.85em; min-height: 1.2em; }
        #authMsg.error { color: #a00; }
        #authMsg.ok { color: #060; }
        #appRoot { display: none; }
        #userBadge { color: #555; font-size: 0.85em; }

        /* === Small screens === */
        @media (max-width: 700px) {
            body { padding: 8px; }
            .toolbar { padding: 8px; gap: 8px; }
            th, td { padding: 6px; }
            /* Narrow columns can't absorb a nowrap header — let it wrap instead */
            th { white-space: normal; }
            td.cell-actions button { font-size: 1.5em; padding: 4px 1px; margin: 0; }
            /* Mobile view packs 4 action buttons + a full date into ~110px each */
            table.view-mobile td.cell-actions button { font-size: 1.2em; }
            table.view-mobile td.col-next { font-size: 0.85em; }
            /* Long-press opens the view modal — don't select text or pop the callout */
            #taskTableBody td { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
            .modal { min-width: 0; padding: 16px; }
            .modal-grid.wide { grid-template-columns: auto 1fr; }
            .modal-grid.wide .span-wide { grid-column: 2 / 3; }
        }
    </style>
</head>
<body>

    <!-- Auth gate -->
    <div id="authOverlay">
        <div id="authBox">
            <h1>Huginn Tasks</h1>
            <p class="sub">Sign in to your space</p>
            <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
            <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
            <div id="authBtns">
                <button id="signInBtn">Sign in</button>
                <button id="signUpBtn" class="secondary">Sign up</button>
            </div>
            <div id="authMsg"></div>
        </div>
    </div>

    <!-- App -->
    <div id="appRoot">
        <!-- Top toolbar: quick add & actions -->
        <div class="toolbar" id="quickAddBar">
            <input type="text" id="quickAddText" placeholder="Quick add: type task name and press Enter...">
            <button id="addTaskBtn" title="Add task via modal with all fields">+ Add Task</button>
        </div>

        <!-- Advanced actions (collapsible) -->
        <div class="toolbar" id="advancedBar">
            <button id="advancedToggleBtn" class="secondary" title="Show/hide advanced actions">▸ Advanced actions</button>
            <span class="toolbar-spacer"></span>
            <span id="userBadge"></span>
        </div>
        <div class="toolbar" id="advancedActions" hidden>
            <button id="importBtn" title="Import data from .json file">Import JSON</button>
            <button id="exportJsonBtn" title="Export all data to .json">Export JSON</button>
            <button id="exportCsvBtn" title="Export current view to .csv">Export CSV</button>
            <button id="recalcOrderBtn" title="Re-number order of visible tasks sequentially">Recalc Order</button>
            <span class="toolbar-spacer"></span>
            <button id="signOutBtn" class="secondary" title="Sign out">Sign out</button>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <!-- Filter toolbar -->
        <div class="toolbar" id="filterBar">
            <input type="text" id="filterText" placeholder="Filter tasks...">
            <button id="toggleViewBtn" title="Toggle between showing active tasks and all tasks">Show Active</button>
            <button id="overdueBtn" title="Show only overdue and due tasks">Overdue/Due</button>
            <button id="toggleColumnsBtn" title="Cycle column set: full → reduced → mobile">View: Full</button>
        </div>

        <!-- Main table -->
        <table id="taskTable">
            <thead>
                <tr>
                    <th class="col-actions" data-sort-key="status">Actions</th>
                    <th class="col-order" data-sort-key="order">Order</th>
                    <th class="col-text" data-sort-key="text">Task</th>
                    <th class="col-project" data-sort-key="projectId">Project</th>
                    <th class="col-effort" data-sort-key="effort">Eff</th>
                    <th class="col-created" data-sort-key="createdAt">Created</th>
                    <th class="col-next" data-sort-key="nextActionDate">Next Action</th>
                    <th class="col-deadline" data-sort-key="deadline">Deadline</th>
                    <th class="col-desc" data-sort-key="description">Description</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>

        <div id="summaryStats"></div>
    </div>

    <!-- Edit Modal (single task) -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal">
            <h2 id="editModalTitle">Edit Task</h2>
            <p id="editMultiHint" hidden>Only the fields you change are written to the selected tasks. Fields that differ across the selection show <em>— mixed —</em>.</p>
            <div class="modal-grid wide">
                <label for="editText">Task:</label>
                <input type="text" id="editText" class="span-wide">

                <label for="editDesc">Description:</label>
                <textarea id="editDesc" class="span-wide"></textarea>

                <label for="editProject">Project:</label>
                <select id="editProject"></select>

                <label for="editStatus">Status:</label>
                <select id="editStatus">
                    <option value="new">New</option>
                    <option value="started">Started</option>
                    <option value="done">Done</option>
                    <option value="stopped">Stopped</option>
                </select>

                <label for="editEffort">Effort:</label>
                <input type="number" id="editEffort" min="1" value="1">

                <label for="editOrder">Order:</label>
                <input type="number" id="editOrder" step="any">

                <label for="editNextAction">Next Action:</label>
                <input type="date" id="editNextAction">

                <label for="editDeadline">Deadline:</label>
                <input type="date" id="editDeadline">

                <label for="editEstDuration">Est. Days:</label>
                <input type="number" id="editEstDuration" min="1" value="1">

                <label for="editStartDate">Start Date:</label>
                <input type="date" id="editStartDate">

                <label for="editStartDateType">Start Type:</label>
                <select id="editStartDateType">
                    <option value="flexible">Flexible</option>
                    <option value="fixed">Fixed</option>
                    <option value="target">Target</option>
                </select>

                <label for="editEndDate">End Date:</label>
                <input type="date" id="editEndDate">

                <label for="editEndDateType">End Type:</label>
                <select id="editEndDateType">
                    <option value="flexible">Flexible</option>
                    <option value="fixed">Fixed</option>
                    <option value="target">Target</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="secondary" id="editCancelBtn">Cancel</button>
                <button id="editSaveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- View Modal (read-only) -->
    <div class="modal-overlay" id="viewModalOverlay">
        <div class="modal">
            <h2>Task Details</h2>
            <div class="view-grid" id="viewModalBody"></div>
            <div class="modal-actions">
                <button class="secondary" id="viewCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="huginn_data_online.js"></script>
    <script>
        // ============================
        // Huginn Tasks (Online)
        // ============================

        const H = HuginnOnline;

        // --- Application State ---
        let data = { tasks: [], projects: [] };
        let editingIds = [];               // uuid strings currently open in the edit modal
        let selectedIds = new Set();       // uuid strings
        let selectionAnchorId = null;      // anchor row for shift-click ranges
        let currentSortKey = 'order';
        let currentSortDirection = 'asc';
        let currentFilterText = '';
        let showAllTasks = false;
        let showOverdueOnly = false;
        let viewMode = 'reduced';          // 'full' | 'reduced' | 'mobile'
        let todayStr = '';

        const VIEW_MODES = ['full', 'reduced', 'mobile'];
        const SORT_KEYS = ['status', 'order', 'text', 'projectId', 'effort',
                           'createdAt', 'nextActionDate', 'deadline', 'description'];

        // --- DOM refs ---
        const appRoot = document.getElementById('appRoot');
        const authOverlay = document.getElementById('authOverlay');
        const authMsg = document.getElementById('authMsg');
        const userBadge = document.getElementById('userBadge');

        const taskTableBody = document.getElementById('taskTableBody');
        const taskTable = document.getElementById('taskTable');
        const summaryStats = document.getElementById('summaryStats');
        const filterTextInput = document.getElementById('filterText');
        const quickAddText = document.getElementById('quickAddText');
        const fileInput = document.getElementById('fileInput');

        const toggleViewBtn = document.getElementById('toggleViewBtn');
        const overdueBtn = document.getElementById('overdueBtn');
        const toggleColumnsBtn = document.getElementById('toggleColumnsBtn');

        const editModalOverlay = document.getElementById('editModalOverlay');
        const editModalTitle = document.getElementById('editModalTitle');
        const editText = document.getElementById('editText');
        const editDesc = document.getElementById('editDesc');
        const editProject = document.getElementById('editProject');
        const editStatus = document.getElementById('editStatus');
        const editEffort = document.getElementById('editEffort');
        const editOrder = document.getElementById('editOrder');
        const editNextAction = document.getElementById('editNextAction');
        const editDeadline = document.getElementById('editDeadline');
        const editEstDuration = document.getElementById('editEstDuration');
        const editStartDate = document.getElementById('editStartDate');
        const editStartDateType = document.getElementById('editStartDateType');
        const editEndDate = document.getElementById('editEndDate');
        const editEndDateType = document.getElementById('editEndDateType');

        const viewModalOverlay = document.getElementById('viewModalOverlay');
        const viewModalBody = document.getElementById('viewModalBody');

        const advancedToggleBtn = document.getElementById('advancedToggleBtn');
        const advancedActions = document.getElementById('advancedActions');

        const editMultiHint = document.getElementById('editMultiHint');
        const editTextLabel = document.querySelector('label[for="editText"]');
        const editDescLabel = document.querySelector('label[for="editDesc"]');

        // --- Error helper ---
        function showError(e) {
            console.error(e);
            alert('Error: ' + (e && e.message ? e.message : e));
        }

        // =====================================
        // AUTH
        // =====================================

        async function handleSignIn() {
            authMsg.className = ''; authMsg.textContent = 'Signing in…';
            try {
                await H.signIn(authEmail.value.trim(), authPassword.value);
                // onAuthChange will drive showApp()
            } catch (e) {
                authMsg.className = 'error';
                authMsg.textContent = e.message || 'Sign-in failed.';
            }
        }

        async function handleSignUp() {
            authMsg.className = ''; authMsg.textContent = 'Creating account…';
            try {
                const res = await H.signUp(authEmail.value.trim(), authPassword.value);
                if (res.session) {
                    authMsg.className = 'ok'; authMsg.textContent = 'Account created.';
                } else {
                    authMsg.className = 'ok';
                    authMsg.textContent = 'Account created — check your email to confirm, then sign in.';
                }
            } catch (e) {
                authMsg.className = 'error';
                authMsg.textContent = e.message || 'Sign-up failed.';
            }
        }

        async function handleSignOut() {
            try { await H.signOut(); } catch (e) { showError(e); }
        }

        let loadedUserId = null;   // guards against redundant reloads

        async function showApp(session) {
            if (!session) {
                appRoot.style.display = 'none';
                authOverlay.style.display = 'flex';
                data = { tasks: [], projects: [] };
                loadedUserId = null;
                return;
            }
            authOverlay.style.display = 'none';
            appRoot.style.display = 'block';
            userBadge.textContent = session.user.email || '';
            // Same user already loaded (e.g. duplicate auth event) — don't refetch.
            if (loadedUserId === session.user.id) return;
            loadedUserId = session.user.id;
            try {
                data = await H.loadAll();
                render();
            } catch (e) {
                showError(e);
            }
        }

        // =====================================
        // PROJECT HELPERS
        // =====================================

        function getProjectName(projectId) {
            if (projectId == null) return 'Personal Tasks';
            return H.getProjectPath(projectId, data.projects) || 'Unknown';
        }

        function populateProjectDropdown(selectEl, includeNoChange) {
            selectEl.innerHTML = '';
            if (includeNoChange) {
                const opt = document.createElement('option');
                opt.value = ''; opt.textContent = '— No change —';
                selectEl.appendChild(opt);
            }
            const personalOpt = document.createElement('option');
            personalOpt.value = 'null'; personalOpt.textContent = 'Personal Tasks';
            selectEl.appendChild(personalOpt);

            data.projects.forEach(p => {
                if (p.name === H.PERSONAL_PROJECT_NAME && p.parentId == null) return;
                const opt = document.createElement('option');
                opt.value = String(p.id);
                opt.textContent = H.getProjectPath(p.id, data.projects);
                selectEl.appendChild(opt);
            });
        }

        // =====================================
        // VIEW MODE & DEEP LINKS
        // =====================================
        // Every filter/view setting round-trips through the query string, so any
        // configuration of the list can be bookmarked or shared as a link.

        function isMobileDevice() {
            if (/Mobi|Android|iPhone|iPod/i.test(navigator.userAgent)) return true;
            // iPadOS ships a desktop UA — a coarse pointer on a smallish screen
            // catches it. Requiring the pointer check keeps a narrow desktop
            // window (mouse) on the reduced view rather than the mobile one.
            return window.matchMedia('(pointer: coarse)').matches
                && window.matchMedia('(max-width: 900px)').matches;
        }

        // Reads ?view/sort/dir/q/all/overdue into state. Anything absent or
        // invalid falls back to the default (mobile devices default to 'mobile').
        function readStateFromUrl() {
            const p = new URLSearchParams(location.search);
            const v = p.get('view');
            viewMode = VIEW_MODES.includes(v) ? v : (isMobileDevice() ? 'mobile' : 'reduced');
            const sort = p.get('sort');
            if (SORT_KEYS.includes(sort)) currentSortKey = sort;
            const dir = p.get('dir');
            if (dir === 'asc' || dir === 'desc') currentSortDirection = dir;
            currentFilterText = p.get('q') || '';
            showAllTasks = p.get('all') === '1';
            showOverdueOnly = p.get('overdue') === '1';
            filterTextInput.value = currentFilterText;
        }

        // Called from render(), so the URL always mirrors the visible state.
        // Defaults are omitted to keep shared links short; `view` is always
        // written so a link pins the layout it was created with.
        function writeStateToUrl() {
            const p = new URLSearchParams();
            p.set('view', viewMode);
            if (currentSortKey !== 'order') p.set('sort', currentSortKey);
            if (currentSortDirection !== 'asc') p.set('dir', currentSortDirection);
            if (currentFilterText.trim()) p.set('q', currentFilterText);
            if (showAllTasks) p.set('all', '1');
            if (showOverdueOnly) p.set('overdue', '1');
            history.replaceState(null, '', location.pathname + '?' + p.toString());
        }

        function cycleViewMode() {
            viewMode = VIEW_MODES[(VIEW_MODES.indexOf(viewMode) + 1) % VIEW_MODES.length];
            render();
        }

        // =====================================
        // FILTERING & SORTING
        // =====================================

        function getFilteredAndSortedTasks() {
            todayStr = H.getTodayDateString();
            let filtered = data.tasks.slice();

            if (!showAllTasks) {
                filtered = filtered.filter(t => t.status === 'new' || t.status === 'started');
            }

            if (showOverdueOnly) {
                filtered = filtered.filter(t => {
                    if (t.status === 'done' || t.status === 'stopped') return false;
                    const nad = t.nextActionDate;
                    const dl = t.deadline;
                    return (nad && nad <= todayStr) || (dl && dl <= todayStr) || H.isRunningLate(t);
                });
            }

            const lowerFilter = currentFilterText.toLowerCase().trim();
            if (lowerFilter) {
                filtered = filtered.filter(t => {
                    const projectName = getProjectName(t.projectId).toLowerCase();
                    return t.text.toLowerCase().includes(lowerFilter)
                        || (t.description || '').toLowerCase().includes(lowerFilter)
                        || projectName.includes(lowerFilter)
                        || String(t.status).includes(lowerFilter);
                });
            }

            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSortKey === 'projectId') {
                    valA = getProjectName(a.projectId);
                    valB = getProjectName(b.projectId);
                } else {
                    valA = a[currentSortKey];
                    valB = b[currentSortKey];
                }
                const isANull = valA === null || valA === '' || valA === undefined;
                const isBNull = valB === null || valB === '' || valB === undefined;
                if (isANull && isBNull) return 0;
                if (isANull) return 1;
                if (isBNull) return -1;
                let cmp = 0;
                if (typeof valA === 'string') cmp = valA.localeCompare(valB);
                else if (typeof valA === 'number') cmp = valA - valB;
                return currentSortDirection === 'asc' ? cmp : -cmp;
            });

            return filtered;
        }

        // =====================================
        // RENDERING
        // =====================================

        function render() {
            todayStr = H.getTodayDateString();
            taskTableBody.innerHTML = '';
            const tasks = getFilteredAndSortedTasks();

            toggleViewBtn.textContent = showAllTasks ? 'Show Active' : `Show All (${data.tasks.length})`;
            overdueBtn.classList.toggle('active-mode', showOverdueOnly);
            toggleColumnsBtn.textContent = 'View: ' + viewMode.charAt(0).toUpperCase() + viewMode.slice(1);
            taskTable.classList.toggle('view-reduced', viewMode === 'reduced');
            taskTable.classList.toggle('view-mobile', viewMode === 'mobile');
            writeStateToUrl();

            document.querySelectorAll('thead th[data-sort-key]').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sortKey === currentSortKey) {
                    th.classList.add(currentSortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });

            tasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.dataset.id = task.id;

                if (task.status === 'done') tr.classList.add('status-done');
                else if (task.status === 'stopped') tr.classList.add('status-stopped');
                if (selectedIds.has(task.id)) tr.classList.add('selected-row');
                if (H.isRunningLate(task)) tr.classList.add('running-late');

                const tdAct = document.createElement('td');
                tdAct.className = 'cell-actions col-actions';

                if (task.status === 'new' || task.status === 'started') {
                    const doneBtn = document.createElement('button');
                    doneBtn.textContent = '✅'; doneBtn.title = 'Mark as done';
                    doneBtn.onclick = (e) => { e.stopPropagation(); setStatus(task.id, 'done'); };
                    tdAct.appendChild(doneBtn);
                } else {
                    const reopenBtn = document.createElement('button');
                    reopenBtn.textContent = '🔄'; reopenBtn.title = 'Re-open task';
                    reopenBtn.onclick = (e) => { e.stopPropagation(); setStatus(task.id, 'new'); };
                    tdAct.appendChild(reopenBtn);
                }

                const editBtn = document.createElement('button');
                editBtn.textContent = '✏️'; editBtn.title = 'Edit task';
                editBtn.onclick = (e) => { e.stopPropagation(); openEditModal(task.id); };
                tdAct.appendChild(editBtn);

                const mailBtn = document.createElement('button');
                mailBtn.textContent = '✉️'; mailBtn.title = 'Send task via email';
                mailBtn.onclick = (e) => { e.stopPropagation(); sendMail(task); };
                tdAct.appendChild(mailBtn);

                if (task.status === 'new' || task.status === 'started') {
                    const stopBtn = document.createElement('button');
                    stopBtn.textContent = '🗑️'; stopBtn.title = 'Stop task';
                    stopBtn.onclick = (e) => { e.stopPropagation(); setStatus(task.id, 'stopped'); };
                    tdAct.appendChild(stopBtn);
                }
                tr.appendChild(tdAct);

                const tdOrder = document.createElement('td');
                tdOrder.className = 'col-order';
                tdOrder.textContent = Number(task.order).toFixed(2);
                tr.appendChild(tdOrder);

                const tdText = document.createElement('td');
                tdText.className = 'col-text';
                tdText.textContent = task.text;
                tr.appendChild(tdText);

                const tdProj = document.createElement('td');
                tdProj.className = 'col-project';
                tdProj.textContent = getProjectName(task.projectId);
                tdProj.style.fontSize = '0.85em';
                tr.appendChild(tdProj);

                const tdEff = document.createElement('td');
                tdEff.className = 'col-effort';
                tdEff.textContent = task.effort;
                tr.appendChild(tdEff);

                const tdCreated = document.createElement('td');
                tdCreated.className = 'col-created';
                tdCreated.textContent = H.formatDateISO(task.createdAt);
                tr.appendChild(tdCreated);

                ['nextActionDate', 'deadline'].forEach(key => {
                    const td = document.createElement('td');
                    td.className = key === 'nextActionDate' ? 'col-next' : 'col-deadline';
                    const dateVal = task[key] || '';
                    td.textContent = dateVal;
                    if (dateVal && (task.status === 'new' || task.status === 'started')) {
                        if (dateVal < todayStr) td.classList.add('date-past');
                        else if (dateVal === todayStr) td.classList.add('date-today');
                    }
                    tr.appendChild(td);
                });

                const tdDesc = document.createElement('td');
                tdDesc.className = 'col-desc cell-desc';
                tdDesc.textContent = task.description || '';
                tr.appendChild(tdDesc);

                taskTableBody.appendChild(tr);
            });

            updateSummary();
        }

        function updateSummary() {
            const c = (s) => data.tasks.filter(t => t.status === s).length;
            const lateCount = data.tasks.filter(t => H.isRunningLate(t)).length;
            let text = `Tasks: New ${c('new')} | Started ${c('started')} | Done ${c('done')} | Stopped ${c('stopped')}`;
            if (lateCount > 0) text += ` | Late ${lateCount}`;
            // The hotkeys have no on-screen buttons, so the summary bar advertises them.
            if (selectedIds.size === 1) text += ' — 1 selected · V view · D done · E edit · R remove · M mail';
            else if (selectedIds.size > 1) text += ` — ${selectedIds.size} selected · E edit`;
            summaryStats.textContent = text;
        }

        // =====================================
        // STATUS MANAGEMENT
        // =====================================

        async function setStatus(taskId, newStatus) {
            const task = data.tasks.find(t => t.id === taskId);
            if (!task) return;
            const changed = H.applyStatus(task, newStatus);   // mutates local task
            render();
            try {
                const row = await H.updateTask(taskId, changed);
                Object.assign(task, row);
            } catch (e) { showError(e); }
        }

        // =====================================
        // QUICK ADD
        // =====================================

        async function quickAddTask() {
            const text = quickAddText.value.trim();
            if (!text) return;

            const activeTasks = data.tasks.filter(t => t.status === 'new' || t.status === 'started');
            const maxOrder = activeTasks.length > 0 ? Math.max(...activeTasks.map(t => Number(t.order))) : 0;

            quickAddText.value = '';
            try {
                const row = await H.createTask({
                    text,
                    status: 'new',
                    order: Math.floor(maxOrder) + 1,
                    nextActionDate: H.getTodayDateString()
                });
                data.tasks.push(row);
                render();
            } catch (e) { showError(e); }
        }

        // =====================================
        // EDIT MODAL
        // =====================================

        // The modal serves three cases: new task, edit one, edit many.
        // Field -> control, in the order they appear in the form.
        const EDIT_CONTROLS = {
            text:                  editText,
            description:           editDesc,
            projectId:             editProject,
            status:                editStatus,
            effort:                editEffort,
            order:                 editOrder,
            nextActionDate:        editNextAction,
            deadline:              editDeadline,
            estimatedDurationDays: editEstDuration,
            startDate:             editStartDate,
            startDateType:         editStartDateType,
            endDate:               editEndDate,
            endDateType:           editEndDateType
        };

        // Fields the user actually touched this time round. Multi-edit writes
        // only these, so an untouched control can never blank out a value.
        const editDirtyFields = new Set();

        Object.entries(EDIT_CONTROLS).forEach(([key, el]) => {
            const mark = () => editDirtyFields.add(key);
            el.addEventListener('input', mark);
            el.addEventListener('change', mark);
        });

        const MIXED = '__mixed__';

        // Reads the form into a fields object using the same parsing for every case.
        function readEditForm() {
            return {
                text: editText.value.trim(),
                description: editDesc.value.trim(),
                projectId: editProject.value === 'null' ? null : editProject.value,
                status: editStatus.value,
                effort: Math.max(1, parseInt(editEffort.value, 10) || 1),
                order: parseFloat(editOrder.value) || 0,
                nextActionDate: editNextAction.value || null,
                deadline: editDeadline.value || null,
                estimatedDurationDays: Math.max(1, parseInt(editEstDuration.value, 10) || 1),
                startDate: editStartDate.value || null,
                startDateType: editStartDateType.value,
                endDate: editEndDate.value || null,
                endDateType: editEndDateType.value
            };
        }

        // Task text and description are per-task by nature — never mass-assigned.
        function setIdentityFieldsEnabled(enabled) {
            editText.disabled = !enabled;
            editDesc.disabled = !enabled;
            editTextLabel.classList.toggle('disabled', !enabled);
            editDescLabel.classList.toggle('disabled', !enabled);
        }

        // Shows a task's value, or a "— mixed —" marker where the selection disagrees.
        function fillControl(key, tasks) {
            const el = EDIT_CONTROLS[key];
            const raw = (t) => {
                if (key === 'projectId') return t.projectId != null ? String(t.projectId) : 'null';
                if (key === 'startDateType' || key === 'endDateType') return t[key] || 'flexible';
                if (key === 'estimatedDurationDays') return String(t[key] || 1);
                return t[key] == null ? '' : String(t[key]);
            };
            const first = raw(tasks[0]);
            const uniform = tasks.every(t => raw(t) === first);

            if (el.tagName === 'SELECT') {
                let mixedOpt = el.querySelector(`option[value="${MIXED}"]`);
                if (!uniform) {
                    if (!mixedOpt) {
                        mixedOpt = document.createElement('option');
                        mixedOpt.value = MIXED;
                        mixedOpt.textContent = '— mixed —';
                        el.insertBefore(mixedOpt, el.firstChild);
                    }
                    el.value = MIXED;
                } else {
                    if (mixedOpt) mixedOpt.remove();
                    el.value = first;
                }
            } else {
                el.value = uniform ? first : '';
                if (el.type !== 'date') el.placeholder = uniform ? '' : '— mixed —';
            }
        }

        function openEditModal(taskIds) {
            const ids = Array.isArray(taskIds) ? taskIds : (taskIds ? [taskIds] : []);
            const tasks = ids.map(id => data.tasks.find(t => t.id === id)).filter(Boolean);
            editingIds = tasks.map(t => t.id);
            editDirtyFields.clear();

            populateProjectDropdown(editProject, false);
            // Drop any "— mixed —" options left over from a previous multi-edit
            [editStatus, editStartDateType, editEndDateType].forEach(sel => {
                const opt = sel.querySelector(`option[value="${MIXED}"]`);
                if (opt) opt.remove();
            });

            const multi = tasks.length > 1;
            editMultiHint.hidden = !multi;
            setIdentityFieldsEnabled(!multi);

            if (tasks.length === 0) {
                // New task
                editModalTitle.textContent = 'New Task';
                editText.value = '';
                editDesc.value = '';
                editProject.value = 'null';
                editStatus.value = 'new';
                editEffort.value = 1;
                const activeTasks = data.tasks.filter(t => t.status === 'new' || t.status === 'started');
                const maxOrder = activeTasks.length > 0 ? Math.max(...activeTasks.map(t => Number(t.order))) : 0;
                editOrder.value = Math.floor(maxOrder) + 1;
                editNextAction.value = H.getTodayDateString();
                editDeadline.value = '';
                editEstDuration.value = 1;
                editStartDate.value = '';
                editStartDateType.value = 'flexible';
                editEndDate.value = '';
                editEndDateType.value = 'flexible';
            } else {
                editModalTitle.textContent = multi ? `Edit ${tasks.length} Tasks` : 'Edit Task';
                Object.keys(EDIT_CONTROLS).forEach(key => fillControl(key, tasks));
            }

            editModalOverlay.classList.add('active');
            (multi ? editProject : editText).focus();
        }

        function closeEditModal() {
            editModalOverlay.classList.remove('active');
            editingIds = [];
            editDirtyFields.clear();
        }

        async function saveEditModal() {
            const multi = editingIds.length > 1;
            const form = readEditForm();

            if (!multi && !form.text) { editText.focus(); return; }

            try {
                if (multi) {
                    await saveMultiEdit(form);
                } else if (editingIds.length === 1) {
                    const task = data.tasks.find(t => t.id === editingIds[0]);
                    if (task) {
                        const newStatus = form.status;
                        const { status, ...rest } = form;
                        Object.assign(task, rest);
                        if (task.status !== newStatus) H.applyStatus(task, newStatus);
                        const payload = { ...rest, status: task.status, startedAt: task.startedAt, finishedAt: task.finishedAt };
                        const row = await H.updateTask(task.id, payload);
                        Object.assign(task, row);
                    }
                } else {
                    const newStatus = form.status;
                    const { status, ...rest } = form;
                    const tmp = { ...rest, status: 'new', startedAt: null, finishedAt: null };
                    if (newStatus !== 'new') H.applyStatus(tmp, newStatus);
                    const row = await H.createTask(tmp);
                    data.tasks.push(row);
                }
                closeEditModal();
                render();
            } catch (e) { showError(e); }
        }

        // Applies only the touched fields across the selection. Status goes through
        // applyStatus so started/finished timestamps stay consistent per task.
        async function saveMultiEdit(form) {
            const keys = [...editDirtyFields].filter(k => k !== 'text' && k !== 'description');
            if (keys.length === 0) return;

            const updates = [];
            editingIds.forEach(id => {
                const task = data.tasks.find(t => t.id === id);
                if (!task) return;
                const fields = {};
                keys.forEach(k => {
                    if (k === 'status') {
                        Object.assign(fields, H.applyStatus(task, form.status));
                    } else {
                        task[k] = form[k];
                        fields[k] = form[k];
                    }
                });
                updates.push({ id, fields });
            });

            render();
            await H.updateTasksEach(updates);
        }

        // =====================================
        // VIEW MODAL (read-only)
        // =====================================
        // Opened by double-click (desktop) or long-press (mobile) on a row —
        // shows every field, including the ones the mobile/reduced views hide.

        const VIEW_FIELDS = [
            ['Task',        t => t.text],
            ['Description', t => t.description || '—'],
            ['Project',     t => getProjectName(t.projectId)],
            ['Status',      t => t.status],
            ['Effort',      t => t.effort],
            ['Order',       t => Number(t.order).toFixed(2)],
            ['Created',     t => H.formatDateISO(t.createdAt) || '—'],
            ['Next Action', t => t.nextActionDate || '—'],
            ['Deadline',    t => t.deadline || '—'],
            ['Est. Days',   t => t.estimatedDurationDays || '—'],
            ['Start Date',  t => t.startDate ? `${t.startDate} (${t.startDateType || 'flexible'})` : '—'],
            ['End Date',    t => t.endDate ? `${t.endDate} (${t.endDateType || 'flexible'})` : '—'],
            ['Started At',  t => H.formatDateISO(t.startedAt) || '—'],
            ['Finished At', t => H.formatDateISO(t.finishedAt) || '—']
        ];

        function openViewModal(taskId) {
            const task = data.tasks.find(t => t.id === taskId);
            if (!task) return;
            viewModalBody.innerHTML = '';
            VIEW_FIELDS.forEach(([label, get]) => {
                const k = document.createElement('div');
                k.className = 'k';
                k.textContent = label + ':';
                const v = document.createElement('div');
                v.className = 'v';
                v.textContent = String(get(task));
                viewModalBody.appendChild(k);
                viewModalBody.appendChild(v);
            });
            viewModalOverlay.classList.add('active');
        }

        function closeViewModal() {
            viewModalOverlay.classList.remove('active');
        }

        // =====================================
        // SELECTION
        // =====================================
        // Plain click selects one row; ctrl/cmd-click toggles; shift-click extends
        // from the anchor across the rows as currently sorted and filtered.

        function handleRowClick(id, e) {
            const visible = getFilteredAndSortedTasks().map(t => t.id);

            if (e.shiftKey && selectionAnchorId && visible.includes(selectionAnchorId)) {
                const from = visible.indexOf(selectionAnchorId);
                const to = visible.indexOf(id);
                if (from !== -1 && to !== -1) {
                    const [lo, hi] = from < to ? [from, to] : [to, from];
                    // Shift-click replaces the range but keeps the anchor put,
                    // so dragging the far end around re-picks rather than accumulates.
                    selectedIds = new Set(visible.slice(lo, hi + 1));
                }
            } else if (e.metaKey || e.ctrlKey) {
                selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
                selectionAnchorId = id;
            } else {
                const onlyThis = selectedIds.size === 1 && selectedIds.has(id);
                selectedIds = onlyThis ? new Set() : new Set([id]);
                selectionAnchorId = onlyThis ? null : id;
            }
            render();
        }

        function clearSelection() {
            if (selectedIds.size === 0) return false;
            selectedIds.clear();
            selectionAnchorId = null;
            render();
            return true;
        }

        // The single-selection hotkeys, mirroring the per-row action buttons.
        function runSingleSelectionAction(key, id) {
            const task = data.tasks.find(t => t.id === id);
            if (!task) return;
            switch (key) {
                case 'v': openViewModal(id); break;
                case 'd': setStatus(id, task.status === 'done' ? 'new' : 'done'); break;
                case 'e': openEditModal(id); break;
                case 'r': setStatus(id, task.status === 'stopped' ? 'new' : 'stopped'); break;
                case 'm': sendMail(task); break;
            }
        }

        // =====================================
        // MAIL
        // =====================================

        function sendMail(task) {
            const project = getProjectName(task.projectId);
            const subject = encodeURIComponent(`Task: ${task.text}`);
            const lines = [
                `Task: ${task.text}`,
                `Project: ${project}`,
                `Status: ${task.status}`,
                `Effort: ${task.effort}`,
                task.nextActionDate ? `Next Action: ${task.nextActionDate}` : '',
                task.deadline ? `Deadline: ${task.deadline}` : '',
                task.description ? `\nDescription:\n${task.description}` : ''
            ].filter(Boolean);
            const body = encodeURIComponent(lines.join('\n'));
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        // =====================================
        // IMPORT / EXPORT
        // =====================================

        function doExportJSON() {
            const payload = { huginnVersion: 'online-1.0', tasks: data.tasks, projects: data.projects };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `huginn_online_${H.getTodayDateString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function doExportCSV() {
            const tasks = getFilteredAndSortedTasks();
            const headers = ['text', 'status', 'project', 'effort', 'order',
                'createdAt', 'nextActionDate', 'deadline', 'description',
                'estimatedDurationDays', 'startDate', 'endDate'];
            const esc = (cell) => `"${String(cell == null ? '' : cell).replace(/[\n\r]/g, ' ').replace(/"/g, '""')}"`;
            const rows = [headers.join(',')];
            tasks.forEach(t => {
                const row = { ...t, project: getProjectName(t.projectId), createdAt: H.formatDateISO(t.createdAt) };
                rows.push(headers.map(h => esc(row[h])).join(','));
            });
            const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `huginn_tasks_${H.getTodayDateString()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Sanitize an imported task object into insertable field values.
        function sanitizeImportedTask(t, projectIdMap) {
            const validStatus = H.TASK_STATUSES.includes(t.status) ? t.status : 'new';
            const validDateType = (v) => H.DATE_TYPES.includes(v) ? v : 'flexible';
            const dateOnly = (v) => (v ? String(v).split('T')[0] : null);
            // Remap legacy integer projectId -> new uuid (or null for Personal Tasks)
            let projectId = null;
            if (t.projectId != null && projectIdMap.has(t.projectId)) {
                projectId = projectIdMap.get(t.projectId);
            }
            return {
                text: t.text || 'Unnamed Task',
                description: t.description || '',
                status: validStatus,
                startedAt: t.startedAt || null,
                finishedAt: t.finishedAt || null,
                projectId: projectId,
                effort: Math.max(1, parseInt(t.effort, 10) || 1),
                order: parseFloat(t.order) || 0,
                nextActionDate: dateOnly(t.nextActionDate),
                deadline: dateOnly(t.deadline),
                estimatedDurationDays: Math.max(1, parseInt(t.estimatedDurationDays, 10) || 1),
                startDate: dateOnly(t.startDate),
                startDateType: validDateType(t.startDateType),
                endDate: dateOnly(t.endDate),
                endDateType: validDateType(t.endDateType)
            };
        }

        async function doImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const raw = JSON.parse(e.target.result);
                    const importedTasks = Array.isArray(raw) ? raw : (raw.tasks || []);
                    const importedProjects = Array.isArray(raw) ? [] : (raw.projects || []);

                    if (!importedTasks.length) { alert('No tasks found in file.'); return; }

                    // Create projects first (flattened — online Tasks is flat).
                    // Skip the offline auto "Personal Tasks" project; its tasks map to null.
                    const projectIdMap = new Map(); // oldId -> newUuid
                    for (const p of importedProjects) {
                        if (p.name === H.PERSONAL_PROJECT_NAME && p.parentId == null) continue;
                        const created = await H.createProject(p.name || 'Imported Project', null);
                        data.projects.push(created);
                        projectIdMap.set(p.id, created.id);
                    }

                    const fieldsList = importedTasks.map(t => sanitizeImportedTask(t, projectIdMap));
                    const rows = await H.createTasks(fieldsList);
                    data.tasks.push(...rows);

                    render();
                    alert(`Imported ${rows.length} tasks` +
                          (projectIdMap.size ? ` and ${projectIdMap.size} projects (flattened).` : '.'));
                } catch (err) {
                    showError(err);
                }
            };
            reader.readAsText(file);
            event.target.value = null;
        }

        // =====================================
        // ORDER RECALCULATION
        // =====================================

        async function recalcOrder() {
            const visible = getFilteredAndSortedTasks();
            const updates = [];
            visible.forEach((t, i) => {
                const newOrder = i + 1.0;
                const task = data.tasks.find(x => x.id === t.id);
                if (task) { task.order = newOrder; updates.push({ id: task.id, fields: { order: newOrder } }); }
            });
            render();
            try { await H.updateTasksEach(updates); } catch (e) { showError(e); }
        }

        // =====================================
        // EVENT LISTENERS
        // =====================================

        document.getElementById('signInBtn').addEventListener('click', handleSignIn);
        document.getElementById('signUpBtn').addEventListener('click', handleSignUp);
        document.getElementById('signOutBtn').addEventListener('click', handleSignOut);
        authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSignIn(); });

        quickAddText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); quickAddTask(); }
        });
        document.getElementById('addTaskBtn').addEventListener('click', () => openEditModal(null));

        document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', doImport);
        document.getElementById('exportJsonBtn').addEventListener('click', doExportJSON);
        document.getElementById('exportCsvBtn').addEventListener('click', doExportCSV);

        filterTextInput.addEventListener('input', (e) => { currentFilterText = e.target.value; render(); });
        toggleViewBtn.addEventListener('click', () => { showAllTasks = !showAllTasks; render(); });
        overdueBtn.addEventListener('click', () => { showOverdueOnly = !showOverdueOnly; render(); });
        toggleColumnsBtn.addEventListener('click', cycleViewMode);
        document.getElementById('recalcOrderBtn').addEventListener('click', recalcOrder);

        const ADVANCED_OPEN_KEY = 'huginn.advancedOpen';
        function setAdvancedOpen(open) {
            advancedActions.hidden = !open;
            advancedToggleBtn.textContent = (open ? '▾' : '▸') + ' Advanced actions';
            try { localStorage.setItem(ADVANCED_OPEN_KEY, open ? '1' : '0'); } catch (e) { /* private mode */ }
        }
        advancedToggleBtn.addEventListener('click', () => setAdvancedOpen(advancedActions.hidden));

        // A long-press fires a synthetic click on touch devices; swallow it so
        // opening the view modal doesn't also change the selection.
        let longPressTimer = null;
        let suppressNextClick = false;

        taskTableBody.addEventListener('click', (e) => {
            const row = e.target.closest('tr');
            if (!row || e.target.closest('button')) return;
            if (suppressNextClick) return;
            // Second click of a double-click belongs to the view modal, not selection
            if (e.detail > 1) return;
            handleRowClick(row.dataset.id, e);
        });

        // Shift-click would otherwise drag-select the text between the two rows.
        taskTableBody.addEventListener('mousedown', (e) => {
            if (e.shiftKey && e.target.closest('tr') && !e.target.closest('button')) e.preventDefault();
        });

        taskTableBody.addEventListener('dblclick', (e) => {
            const row = e.target.closest('tr');
            if (!row || e.target.closest('button')) return;
            openViewModal(row.dataset.id);
        });

        taskTableBody.addEventListener('touchstart', (e) => {
            const row = e.target.closest('tr');
            if (!row || e.target.closest('button')) return;
            clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                longPressTimer = null;
                suppressNextClick = true;
                setTimeout(() => { suppressNextClick = false; }, 700);
                openViewModal(row.dataset.id);
            }, 500);
        }, { passive: true });

        ['touchmove', 'touchend', 'touchcancel'].forEach(ev => {
            taskTableBody.addEventListener(ev, () => {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }, { passive: true });
        });

        document.querySelectorAll('thead th[data-sort-key]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sortKey;
                if (currentSortKey === key) {
                    currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortKey = key;
                    currentSortDirection = 'asc';
                }
                render();
            });
        });

        document.getElementById('editSaveBtn').addEventListener('click', saveEditModal);
        document.getElementById('editCancelBtn').addEventListener('click', closeEditModal);
        editModalOverlay.addEventListener('click', (e) => { if (e.target === editModalOverlay) closeEditModal(); });

        document.getElementById('viewCloseBtn').addEventListener('click', closeViewModal);
        viewModalOverlay.addEventListener('click', (e) => { if (e.target === viewModalOverlay) closeViewModal(); });

        const SINGLE_SELECTION_KEYS = ['v', 'd', 'e', 'r', 'm'];

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (editModalOverlay.classList.contains('active')) { closeEditModal(); return; }
                if (viewModalOverlay.classList.contains('active')) { closeViewModal(); return; }
                clearSelection();
                return;
            }

            // Never steal keystrokes from a text field or an open modal.
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            if (editModalOverlay.classList.contains('active') ||
                viewModalOverlay.classList.contains('active')) return;
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            if (selectedIds.size === 0) return;

            const key = e.key.toLowerCase();
            if (selectedIds.size > 1) {
                // Multi-selection supports edit only.
                if (key === 'e') { e.preventDefault(); openEditModal([...selectedIds]); }
                return;
            }
            if (SINGLE_SELECTION_KEYS.includes(key)) {
                e.preventDefault();
                runSingleSelectionAction(key, [...selectedIds][0]);
            }
        });

        editModalOverlay.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveEditModal(); }
        });

        // =====================================
        // INITIALIZATION
        // =====================================
        (async function start() {
            try {
                readStateFromUrl();
                let advOpen = false;
                try { advOpen = localStorage.getItem(ADVANCED_OPEN_KEY) === '1'; } catch (e) { /* private mode */ }
                setAdvancedOpen(advOpen);
                H.init();
                // Defer work out of the auth callback — calling Supabase methods
                // synchronously inside onAuthStateChange can deadlock in v2.
                H.onAuthChange((session) => { setTimeout(() => showApp(session), 0); });
                const session = await H.getSession();
                await showApp(session);
            } catch (e) {
                authMsg.className = 'error';
                authMsg.textContent = 'Init error: ' + (e.message || e);
            }
        })();
    </script>
</body>
</html>
